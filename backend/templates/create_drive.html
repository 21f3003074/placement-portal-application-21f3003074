<!DOCTYPE html>
<html>
<head>
    <title>Create Drive</title>
</head>
<body>

<h1>Create Placement Drive</h1>

<form method="POST">

    <label>Job Title</label>
    <input type="text" name="job_title">
    <br><br>

    <label>Job Description</label>
    <textarea name="job_description"></textarea>
    <br><br>

    <label>Eligibility Branch</label>
    <input type="text" name="eligibility_branch">
    <br><br>

    <label>Minimum CGPA</label>
    <input type="number" step="0.01" name="eligibility_cgpa">
    <br><br>

    <label>Graduation Year</label>
    <input type="number" name="eligibility_year">
    <br><br>

    <label>Application Deadline</label>
    <input type="date" name="application_deadline">
    <br><br>

    <button type="submit">
        Create Drive
    </button>

</form>

</body>
</html>
